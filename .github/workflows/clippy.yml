name: clippy

# Lint the whole workspace natively and for the Windows target on every branch
# push. Both jobs build a check from the flake, so they use the same rust
# toolchain, MSVC CRT/SDK and libplacebo prefix the packages build with, and
# they reuse the dependency layer the binaries are built from (`cargoClippy`
# on `cargoArtifacts`) instead of recompiling it.
#
# A docs-only push is skipped. A new push to the same ref cancels the previous
# clippy run; it is a check, not a release.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "notes/**"
      - "notes.txt"
      - "todo.md"
      - ".opencode/**"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The entry holds `.#linux-deps` plus everything the lint needs, so it
      # only changes with the lockfile or a flake pin.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-clippy-linux-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-clippy-linux-
          gc-max-store-size-linux: 8G

      - name: clippy
        run: nix build .#checks.linux-clippy

  windows:
    name: Windows x64
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Shares the shape of the release's `deps` entry: same derivation, so a
      # nightly's cache makes the next lint run fast.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-clippy-windows-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
          restore-prefixes-first-match: |
            nix-clippy-windows-
            nix-deps-
          gc-max-store-size-linux: 8G

      # The cross build; `CARGO_BUILD_TARGET` comes from the check's env.
      - name: clippy
        run: nix build .#checks.windows-clippy
