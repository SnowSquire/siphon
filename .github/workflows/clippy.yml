name: clippy

# Lint the whole workspace natively and for the Windows target on every branch
# push. Both jobs build a check from the flake, so they use the same rust
# toolchain, MSVC CRT/SDK and libplacebo prefix the packages build with, and
# they reuse the dependency layer the binaries are built from (`cargoClippy`
# on `cargoArtifacts`) instead of recompiling it.
#
# A docs-only push is skipped. A new push to the same ref cancels the previous
# clippy run; it is a check, not a release.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "notes/**"
      - "notes.txt"
      - "todo.md"
      - ".opencode/**"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with release.yml: the Windows lint restores that job's entry.
  CACHE_VERSION: v1

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The entry holds `.#linux-deps` plus everything the lint needs. The key
      # is that derivation's own hash, so it changes with the dependency set,
      # the toolchain or the cross environment -- and not with a release bump.
      - name: dependency layer key
        id: deps
        # The layer's own derivation names exactly the inputs that matter: the
        # dependency set, the toolchain and the cross environment. Hashing the
        # lockfile instead would also hash the workspace version, which
        # `depsSrc` deliberately keeps out of the layer.
        run: echo "drv=$(nix eval --raw .#linux-deps.drvPath | sed 's|/nix/store/||; s|-.*||')" >> "$GITHUB_OUTPUT"

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-clippy-linux-${{ steps.deps.outputs.drv }}
          restore-prefixes-first-match: nix-clippy-linux-
          gc-max-store-size-linux: 8G

      - name: clippy
        run: nix build .#linux-clippy

  windows:
    name: Windows x64
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Restores the release's `deps` entry and saves nothing: the Windows
      # dependency layer is the same derivation, so a second copy under a
      # `nix-clippy-windows-` key would only spend the repository cache budget
      # twice. The lint artifacts on top are a workspace compile, which is
      # minutes, not the layer.
      - name: dependency layer key
        id: deps
        # The layer's own derivation names exactly the inputs that matter: the
        # dependency set, the toolchain and the cross environment. Hashing the
        # lockfile instead would also hash the workspace version, which
        # `depsSrc` deliberately keeps out of the layer.
        run: echo "drv=$(nix eval --raw .#windows-deps.drvPath | sed 's|/nix/store/||; s|-.*||')" >> "$GITHUB_OUTPUT"

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-deps-${{ env.CACHE_VERSION }}-${{ steps.deps.outputs.drv }}
          restore-prefixes-first-match: |
            nix-deps-${{ env.CACHE_VERSION }}-
          save: false

      # The cross build; `CARGO_BUILD_TARGET` comes from the check's env.
      - name: clippy
        run: nix build .#windows-clippy
