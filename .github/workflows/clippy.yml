name: clippy

# Lint the whole workspace natively and for the Windows target on every branch
# push. The Windows job is the same cross setup the release uses, so it restores
# the xwin/shaderc/libplacebo caches from a release run instead of rebuilding
# them. Keep the pins and the cache keys identical to release.yml: the caches
# are shared by key, not by workflow.
#
# A docs-only push is skipped. A new push to the same ref cancels the previous
# clippy run; it is a check, not a release.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "notes/**"
      - "notes.txt"
      - "todo.md"
      - ".opencode/**"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with release.yml.
  XWIN_VERSION: "0.10.0"
  SHADERC_VERSION: v2026.4
  LIBPLACEBO_REV: b785229836d6879249ecb21551ba098ed549b5f6

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm pkg-config libplacebo-dev libvulkan-dev \
            libxkbcommon-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-clippy
          cache-on-failure: true

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

  windows:
    name: Windows x64 (cross)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build pkg-config libvulkan-dev
          clang-cl --version >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install meson
        run: pip install --disable-pip-version-check meson jinja2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-clippy
          cache-on-failure: true

      - name: cache xwin and the MSVC CRT/SDK
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/xwin
            ~/.cache/xwin-cache
            ~/.cache/xwin
          key: xwin-${{ env.XWIN_VERSION }}-${{ runner.os }}-v1

      - name: install xwin and splat the CRT/SDK
        run: |
          command -v xwin >/dev/null || \
            cargo install xwin --locked --version "$XWIN_VERSION"
          if [[ ! -d "$HOME/.cache/xwin/crt/include" ]]; then
            xwin --accept-license --cache-dir "$HOME/.cache/xwin-cache" \
              splat --output "$HOME/.cache/xwin"
          fi
          splat="$HOME/.cache/xwin"
          {
            echo "RUSTFLAGS=-Lnative=$splat/crt/lib/x86_64 -Lnative=$splat/sdk/lib/um/x86_64 -Lnative=$splat/sdk/lib/ucrt/x86_64"
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link"
            echo "CC_x86_64_pc_windows_msvc=clang-cl"
            echo "CXX_x86_64_pc_windows_msvc=clang-cl"
            echo "AR_x86_64_pc_windows_msvc=llvm-lib"
            echo "CFLAGS_x86_64_pc_windows_msvc=--target=x86_64-pc-windows-msvc /imsvc$splat/crt/include /imsvc$splat/sdk/include/ucrt /imsvc$splat/sdk/include/um /imsvc$splat/sdk/include/shared"
            echo "CXXFLAGS_x86_64_pc_windows_msvc=--target=x86_64-pc-windows-msvc /imsvc$splat/crt/include /imsvc$splat/sdk/include/ucrt /imsvc$splat/sdk/include/um /imsvc$splat/sdk/include/shared"
          } >> "$GITHUB_ENV"

      - name: point the build scripts at the prefixes
        run: |
          {
            echo "LIBS_ROOT=$RUNNER_TEMP/libs"
            echo "SHADERC_PREFIX=$RUNNER_TEMP/libs/shaderc/win-prefix"
            echo "SHADERC_BUILD=$RUNNER_TEMP/libs/shaderc-build"
            echo "LIBPLACEBO_PREFIX=$RUNNER_TEMP/libs/libplacebo/win-prefix"
            echo "LIBPLACEBO_SRC=$RUNNER_TEMP/libs/libplacebo"
            echo "VULKAN_SDK=$RUNNER_TEMP/libs/vulkan"
          } >> "$GITHUB_ENV"

      - name: cache shaderc and libplacebo prefixes
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/libs/shaderc/win-prefix
            ${{ runner.temp }}/libs/libplacebo/win-prefix
            ${{ runner.temp }}/libs/vulkan
          key: win-deps-${{ env.SHADERC_VERSION }}-${{ env.LIBPLACEBO_REV }}-${{ hashFiles('scripts/build-shaderc-win.sh', 'scripts/build-libplacebo-win.sh') }}

      - name: cache shaderc sources
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libs/shaderc
          key: shaderc-src-${{ env.SHADERC_VERSION }}-v1

      - name: cache the libplacebo checkout
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libs/libplacebo
          key: libplacebo-src-${{ env.LIBPLACEBO_REV }}-v1

      - name: pin libplacebo
        run: |
          src="$LIBPLACEBO_SRC"
          if [[ ! -d "$src/.git" ]]; then
            # Blobless, not shallow: any pinned commit can be checked out and
            # the blobs arrive on demand.
            git clone --quiet --filter=blob:none https://github.com/haasn/libplacebo "$src"
          fi
          git -C "$src" checkout --quiet "$LIBPLACEBO_REV"

      - name: build shaderc
        run: |
          if [[ ! -f "$SHADERC_PREFIX/lib/pkgconfig/shaderc.pc" ]]; then
            scripts/build-shaderc-win.sh
          fi

      - name: build libplacebo
        run: |
          if [[ ! -f "$LIBPLACEBO_PREFIX/lib/pkgconfig/libplacebo.pc" ]]; then
            scripts/build-libplacebo-win.sh --clean
          fi

      - name: clippy
        run: scripts/cargo-win.sh clippy --workspace --all-targets --locked
