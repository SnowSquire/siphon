name: release

# Releases on a vX.Y.Z tag (which must match the workspace version, so a
# release cannot ship binaries that do not match its source) and on manual
# dispatch of any branch, tag or commit. A manual run uploads the setup, the
# portable zip and the symbols zip as workflow artifacts and creates no tag or
# release.
# A nightly builds main at 10:00 UTC unless that commit already has a
# successful run of this workflow; it also uploads artifacts only.
# Nothing runs on pull requests. GitHub adds the source archives itself; the
# assets below are the setup, the portable zip and the symbols zip.
#
# Everything is built by the flake: `nix/sources.nix` pins the MSVC CRT/SDK,
# shaderc and libplacebo, `nix/msvc.nix` owns the cross toolchain, and
# `nix/windows-installer.nix` packages the payload. The runner installs no
# compiler of its own, so the release and `nix build .#windows-installer` on a
# dev box produce the same bytes.
#
# The build is split across two jobs so the store cache holds something stable.
# `deps` builds `.#windows-deps` — every dependency crate — and caches it under
# a key made of the lockfile and the flake pins; the layer only changes on a
# dependency or toolchain bump. `windows` restores that entry, reads only
# (`save: false`), and compiles the two binaries plus the installer, which
# change on every commit and are therefore never cached.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  schedule:
    # GitHub may fire this late; the gate only cares whether the commit is
    # already built, not what time it is.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA, branch or tag to build (blank = the selected ref)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Bump to invalidate both cache entries without touching the tree.
  CACHE_VERSION: v1

jobs:
  # The nightly skips a commit this workflow already built successfully; a
  # failed or cancelled run is retried the next day. Everything that is not a
  # schedule passes straight through.
  gate:
    name: nightly gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: decide
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built="$(
            gh run list --workflow release.yml --commit "$GITHUB_SHA" --limit 100 \
              --json databaseId,status,conclusion 2>/dev/null \
              | jq --argjson current "$GITHUB_RUN_ID" \
                '[.[] | select(.databaseId != $current and .status == "completed" and .conclusion == "success")] | length' \
              || echo 0
          )"
          if (( built > 0 )); then
            echo "$GITHUB_SHA already has a successful build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Windows dependency layer
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The entry holds the dependency layer plus everything it needed to be
      # built: the MSVC CRT/SDK, the rust toolchain, the vendored crates and
      # every compiled dependency. It is reused until `Cargo.lock`, a flake pin
      # or the msvc environment changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-deps-${{ env.CACHE_VERSION }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
          restore-prefixes-first-match: |
            nix-deps-${{ env.CACHE_VERSION }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-deps-
          purge-last-accessed: P30D

      - name: build the dependency layer
        run: nix build .#windows-deps

  windows:
    name: Windows x64 installer, portable zip and symbols
    needs:
      - gate
      - deps
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          # Full history so a manual run can name a short SHA as well as a
          # branch or tag. `self.rev` also comes from the checkout, so the
          # binaries embed the commit they were built from.
          fetch-depth: 0

      - name: resolve the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A tag push still has to be vX.Y.Z and agree with the tree. A manual
          # build is allowed to name any commit, so only its Cargo.toml counts.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags must be vX.Y.Z, got $tag"
              exit 1
            fi
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::$tag does not match Cargo.toml's version $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Same key as the `deps` job: this restores the dependency layer and
      # saves nothing, so the entry stays small and stable.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-deps-${{ env.CACHE_VERSION }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
          restore-prefixes-first-match: |
            nix-deps-${{ env.CACHE_VERSION }}-
          save: false

      - name: build the artefacts
        run: nix build .#windows-installer --print-out-paths

      - name: publish
        # `act` sets ACT=true for local runs; there is no token there and no
        # release to write. Manual and scheduled runs publish artifacts below
        # instead, so they never create a tag.
        if: ${{ !env.ACT && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          body: |
            **Installer (recommended):** `siphon-${{ steps.version.outputs.version }}-x64-setup.exe`
            installs for the current user only, with an uninstaller and a Start
            menu entry, and is what the in-app updater downloads.

            **Portable:** `siphon-${{ steps.version.outputs.version }}-x64-portable.zip`
            extracts to a `siphon-${{ steps.version.outputs.version }}/` folder;
            run `siphon.exe` from it. No install, no updater.

            **Symbols:** `siphon-${{ steps.version.outputs.version }}-x64-symbols.zip`
            holds the release PDBs for both executables. Point a debugger's
            symbol path at the extracted folder to resolve a minidump.

            The installer and the portable build need the Microsoft Visual C++
            2015-2022 Redistributable (x64); the installer adds it when it is
            missing, the portable zip does not.
          files: |
            result/*-setup.exe
            result/*-portable.zip
            result/*-symbols.zip

      # v7 can upload one file unzipped: each download is the setup, the
      # portable zip or the symbols zip itself, not a wrapper artifact.
      - name: upload the installer
        if: ${{ !env.ACT && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: actions/upload-artifact@v7
        with:
          path: result/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: upload the portable zip
        if: ${{ !env.ACT && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: actions/upload-artifact@v7
        with:
          path: result/*-portable.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: upload the symbols
        if: ${{ !env.ACT && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: actions/upload-artifact@v7
        with:
          path: result/*-symbols.zip
          if-no-files-found: error
          retention-days: 14
          archive: false
