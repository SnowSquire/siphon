#:schema https://www.schemastore.org/cargo.json

[package]
name = "twitch-hls-client2"
version = "0.1.0"
edition = "2024"
description = "A package to consume streams from twitch.tv in a variety of ways"
authors = ["Ozeniken"]


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
compio = { version = "0.19", features = [
    "macros",
    "net",
    "fs",
    "time",
    "signal",
] }
eros = { version = "=0.9.0-rc.0", default-features = false, features = [
    "alloc",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
httparse = "1"
kanal = "0.1.1"
memchr = "2.8"
mimalloc = "0.1.52"
rand = "0.10.2"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
socket2 = "0.6"
sonic-rs = "0.5.8"
thiserror = "2.0.20"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }


[lints]
workspace = true

[profile.dev]
panic = "abort"
