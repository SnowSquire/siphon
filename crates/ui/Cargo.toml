#:schema https://www.schemastore.org/cargo.json

[package]
name = "siphon-ui"
version.workspace = true
edition = "2024"
description = "Siphon UI: a ZGUI window fed by the daemon RPC, presented through DXGI or a Vulkan swapchain"
authors = ["Ozeniken"]
license.workspace = true
publish = false

[[bin]]
name = "siphon"
path = "src/main.rs"

[dependencies]
ash = "0.38"
compio = { version = "0.19", features = ["net", "time", "runtime", "fs"] }
dirs = "6"
eros = { version = "=0.9.0-rc.0", default-features = false, features = [
  "alloc",
  "context",
] }
# Must match the version parley (inside zgui) resolves, so the emoji generic
# is bound in the same font collection the shaper reads.
fontique = "0.11.1"
kanal = "0.1.1"
libplacebo-sys = { path = "../libplacebo-sys" }
pollster = "0.4"
raw-window-handle = "0.6"
siphon-shared = { path = "../shared" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zgui = { git = "https://github.com/zortax/zgui", rev = "aacaa469ee36eccf73a19bdb83356a7b8cd803c1" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "aacaa469ee36eccf73a19bdb83356a7b8cd803c1" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "aacaa469ee36eccf73a19bdb83356a7b8cd803c1" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "aacaa469ee36eccf73a19bdb83356a7b8cd803c1" }

# The Win32 shell: the tray, the single-instance handover and the DXGI chain.
[target.'cfg(windows)'.dependencies]
app-single-instance = "0.1"
# OS toasts: the window decides and raises them, the daemon only publishes the
# transition. `winreg` writes the per-user AUMID.
tauri-winrt-notification = "0.8"
winreg = "0.55"
windows = { version = "0.62.2", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = "1"
ureq = "3"

[lints]
workspace = true
