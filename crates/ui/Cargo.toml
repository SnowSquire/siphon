#:schema https://www.schemastore.org/cargo.json

[package]
name = "siphon-ui"
version.workspace = true
edition = "2024"
description = "Siphon UI: a ZGUI window fed by the daemon RPC, presented through DXGI on Windows"
authors = ["Ozeniken"]
publish = false

[[bin]]
name = "siphon"
path = "src/main.rs"

[dependencies]
compio = { version = "0.19", features = ["net", "time", "runtime"] }
dirs = "6"
eros = { version = "=0.9.0-rc.0", default-features = false, features = [
  "alloc",
  "context",
] }
kanal = "0.1.1"
siphon-rpc = { path = "../rpc" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

# The DXGI flip chain, libplacebo and the Win32 shell. Linux presents through
# the framework's own wgpu renderer for now, so none of it is needed there.
[target.'cfg(windows)'.dependencies]
app-single-instance = "0.1"
ash = "0.38"
libplacebo-sys = { path = "../libplacebo-sys" }
pollster = "0.4"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[lints]
workspace = true
