#:schema https://www.schemastore.org/cargo.json

[package]
name = "siphon-ui"
version = "0.1.0"
edition = "2024"
description = "Siphon UI: a ZGUI window presented through DXGI, fed by the daemon RPC"
authors = ["Ozeniken"]
publish = false

[[bin]]
name = "siphon"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
anyhow = "1"
app-single-instance = "0.1"
ash = "0.38"
compio = { version = "0.19", features = ["net", "time", "runtime"] }
dirs = "6"
kanal = "0.1.1"
pollster = "0.4"
libplacebo-sys = { path = "../libplacebo-sys" }
raw-window-handle = "0.6"
siphon-rpc = { path = "../rpc" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[lints]
workspace = true
