#:schema https://www.schemastore.org/cargo.json

[package]
name = "siphon-ui"
version = "0.1.0"
edition = "2024"
description = "Siphon UI: the Slint window and tray, rendered from the daemon RPC"
authors = ["Ozeniken"]
publish = false

[[bin]]
name = "siphon"
path = "src/main.rs"

[dependencies]
app-single-instance = "0.1"
compio = { version = "0.19", features = ["net", "time", "runtime"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kanal = "0.1.1"
raw-window-handle = "0.6"
siphon-rpc = { path = "../rpc" }
slint = { version = "1.18", features = ["raw-window-handle-06"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
