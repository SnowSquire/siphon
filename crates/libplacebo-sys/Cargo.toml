#:schema https://json.schemastore.org/cargo.json

[package]
name = "libplacebo-sys"
version = "0.1.0"
edition = "2024"
description = "Bindings, link directives, the header-only libav glue and an optional meson build for libplacebo"
authors = ["Ozeniken"]
publish = false
# One of these per native library, so two crates cannot disagree about which
# libplacebo a binary links.
links = "placebo"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "libplacebo_sys"
path = "src/lib.rs"

[features]
# libplacebo's libav glue (`pl_map_avframe_ex` and friends) is header-only and
# needs FFmpeg's headers to compile. Off by default so a UI-only build needs no
# FFmpeg at all; the video path turns it on.
libav = []

[build-dependencies]
bindgen = "0.73.2"
cc = "1.11.1"
# Discovery is declarative: pkg-config on Linux, an environment-variable
# override for the Windows prefix, and the build-internal hook that runs the
# meson build below when the caller asks for it. Keep the `build.rs` header in
# sync with `LIBPLACEBO_SOURCE` and friends.
system-deps = "9"

# libplacebo is a system dependency found through pkg-config on both platforms.
# `LIBPLACEBO_PREFIX` names a prefix explicitly, and `LIBPLACEBO_SOURCE=build`
# compiles a checkout when no installed copy exists.
[package.metadata.system-deps]
libplacebo = "0"

# The Vulkan headers are only an include-path source for bindgen, so a missing
# `vulkan.pc` is not fatal. The libav glue is gated on the crate feature, and on
# Windows FFmpeg comes from FFMPEG_DIR rather than pkg-config.
[package.metadata.system-deps.'cfg(not(windows))']
vulkan = { version = "0", optional = true }
libavutil = { version = "0", feature = "libav" }
libavcodec = { version = "0", feature = "libav" }
libavformat = { version = "0", feature = "libav" }

[lints]
workspace = true
