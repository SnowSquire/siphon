#:schema https://json.schemastore.org/cargo.json

[package]
name = "libplacebo-sys"
version = "0.1.0"
edition = "2024"
description = "Bindings, link directives and the header-only libav glue for a locally built libplacebo"
authors = ["Ozeniken"]
publish = false
# One of these per native library, so two crates cannot disagree about which
# libplacebo a binary links.
links = "placebo"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "libplacebo_sys"
path = "src/lib.rs"

[features]
# libplacebo's libav glue (`pl_map_avframe_ex` and friends) is header-only and
# needs FFmpeg's headers to compile. Off by default so a UI-only build needs no
# FFmpeg at all; the video path turns it on.
libav = []

[dependencies]

[build-dependencies]
bindgen = "0.73.2"
cc = "1.11.1"
# The build script dispatches on the *target* OS, not the host's `cfg`, so the
# Linux branch must compile into the script even when it runs on Windows (or
# cross-compiles from Linux to Windows).
pkg-config = "0.3"

[lints]
workspace = true
