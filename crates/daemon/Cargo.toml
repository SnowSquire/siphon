#:schema https://www.schemastore.org/cargo.json

[package]
name = "daemon"
version.workspace = true
edition = "2024"
description = "Siphon backend: Twitch HLS pipelines, the stream registry and the Riffle control plane"
authors = ["Ozeniken"]
license.workspace = true

[[bin]]
name = "siphon-daemon"
path = "src/main.rs"


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
compio = { version = "0.19", features = [
    "macros",
    "net",
    "fs",
    "time",
    "signal",
] }
dirs = "6"
eros = { version = "=0.9.0-rc.0", default-features = false, features = [
    "alloc",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
httparse = "1"
kanal = "0.1.1"
memchr = "2.8"
mimalloc = "0.1.52"
rand = "0.10.2"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
siphon-shared = { path = "../shared" }
socket2 = "0.6"
sonic-rs = "0.5.8"
thiserror = "2.0.20"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

# `fcntl(F_SETPIPE_SZ)` sizes the copy pipe; the crate is already in the tree
# through compio, so this only unlocks the feature.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["pipe"] }

# `winreg` reads the install marker for the updater; `windows-sys` is DPAPI for
# the token. The toasts and the AUMID live in the UI now.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
winreg = "0.55"

[lints]
workspace = true



