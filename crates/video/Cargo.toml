#:schema https://www.schemastore.org/cargo.json

[package]
name = "video"
version = "0.1.0"
edition = "2024"
description = "FFplay-like prototype: ZGUI UI, a DXGI swapchain and Vulkan video"
authors = ["Ozeniken"]
publish = false

# The prototype is Windows-only. Keeping the whole dependency set under the target
# cfg lets `cargo check --workspace` on Linux compile the stub main instead of
# dragging in FFmpeg, D3D12 and the ZGUI platform stack.
[target.'cfg(windows)'.dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4.6.6", features = ["derive"] }
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
] }
# Pinned to the zgui commit the `zgui` / `libplacebo` project references are on.
# The repository is still moving, so a branch would make the prototype drift under us.
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[lints]
workspace = true
