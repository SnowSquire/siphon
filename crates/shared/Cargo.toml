#:schema https://www.schemastore.org/cargo.json

[package]
name = "siphon-shared"
version.workspace = true
edition = "2024"
description = "What the Siphon backend and its clients share: the typed RPC, the client settings schema and the file store"
authors = ["Ozeniken"]
license.workspace = true
publish = false

[dependencies]
compio = { version = "0.19", features = ["fs", "net", "time"] }
compio-quic = "0.8.2"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kanal = "0.1.1"
postcard = { version = "1", features = ["use-std"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5.8"
thiserror = "2.0.20"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[lints]
workspace = true
