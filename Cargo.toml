[workspace]
members = [
  "crates/daemon",
  "crates/libplacebo-sys",
  "crates/shared",
  "crates/ui",
  "crates/video",
]
resolver = "2"

[workspace.package]
version = "0.5.0"

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }


unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# Enable entire lint groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }


undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
str_to_string = "warn"


missing_errors_doc = "allow" # Turn off another noisy pedantic lint
# unreachable_pub = "warn"

# Bad rules for this project (see badrules.md for rationale)
too_many_lines = "allow"


# Release artifacts that ship are built elsewhere (the desktop, the Proxmox CI
# box), so this local profile optimises for compile time: no LTO, the default 16
# codegen units. A CI run can still ask for the shipped settings with
# `CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1`.
[profile.release]
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
# The dependencies do the UI's per-frame work — layout, painting, text shaping,
# wgpu and the Win32 bindings — and an optimised build of them is several times
# faster than an unoptimised one. The daemon and the RPC crate stay at the dev
# default, so this costs a one-off dependency build and nothing on incremental
# rebuilds of the workspace.
[profile.dev.package."*"]
opt-level = 3

# The renderer wrapper is small, but it owns the per-resize swapchain work.
[profile.dev.package.siphon-ui]
opt-level = 3
