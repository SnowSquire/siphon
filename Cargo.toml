[workspace]
# `crates/tray` is the old Tauri app; it lives on in its own repository and is
# replaced by the Siphon UI. Leaving it in the workspace pins `windows` 0.61,
# which makes wgpu-hal 29 (windows 0.62) fail to compile against gpu-allocator.
members = ["crates/daemon", "crates/libplacebo-sys", "crates/rpc", "crates/ui", "crates/video"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }


unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# Enable entire lint groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }


undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
str_to_string = "warn"


missing_errors_doc = "allow" # Turn off another noisy pedantic lint
# unreachable_pub = "warn"

# Bad rules for this project (see badrules.md for rationale)
too_many_lines = "allow"


[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
strip = true # moved here from crates/tray (profiles are ignored in member manifests)

[profile.dev]
panic = "abort"